<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1b">
  <meta name="description" content="AURUM · Certamen">
  <title>AURUM</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100b1b;
      --bg-soft: #1b112e;
      --panel: #241532;
      --panel-2: #311d44;
      --gold: #e3b961;
      --gold-light: #f8db9e;
      --gold-muted: #c09d6c;
      --ink: #f6edf8;
      --muted: #c4b5d0;
      --outline: rgba(220, 174, 98, .32);
      --danger: #f8b4bf;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(102, 56, 142, .44), transparent 55%),
        radial-gradient(ellipse at 15% 95%, rgba(194, 131, 61, .13), transparent 36%),
        var(--bg);
      color: var(--ink);
      font-family: 'Times New Roman', Times, serif;
      line-height: 1.5;
    }
    body::before {
      content: ''; position: fixed; z-index: -1; inset: 0;
      opacity: .18; pointer-events: none;
      background-image: linear-gradient(rgba(231, 205, 248, .045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(231, 205, 248, .045) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
      outline: 3px solid var(--gold-light); outline-offset: 4px;
    }
    .shell { max-width: 1140px; margin: auto; padding: 0 28px; }
    .header {
      min-height: 92px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; border-bottom: 1px solid var(--outline);
    }
    .brand { display: flex; align-items: center; gap: 13px; user-select: none; }
    .brand-emblem {
      width: 43px; height: 43px; display: grid; place-items: center; border: 1px solid var(--gold);
      color: var(--gold-light); border-radius: 50%; font-size: 21px; box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--outline);
    }
    .brand-name { font-size: clamp(15px, 2.5vw, 23px); letter-spacing: .12em; line-height: 1.1; color: var(--gold-light); }
    .brand-sub { color: var(--gold-muted); font: 10px/1.7 'Times New Roman', Times, serif; letter-spacing: .19em; }
    .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .header-link { color: var(--ink); background: transparent; border: 1px solid var(--outline); border-radius: 30px; padding: 10px 17px; font: 12px 'Times New Roman', Times, serif; letter-spacing: .07em; }
    .header-link:hover { border-color: var(--gold); color: var(--gold-light); }
    #app { min-height: 620px; }
    .eyebrow { font: 11px/1.6 'Times New Roman', Times, serif; text-transform: uppercase; color: var(--gold); letter-spacing: .27em; }
    .hero { text-align: center; padding: 74px 0 32px; }
    .hero-coin { width: 165px; height: 165px; display: block; margin: 0 auto 23px; filter: drop-shadow(0 12px 28px rgba(230,189,109,.12)); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(45px, 6.5vw, 84px); line-height: 1.02; font-weight: 400; letter-spacing: -.04em; margin: 12px 0 22px; }
    h1 span, .gold { color: var(--gold-light); }
    .lede { font: 16px/1.8 'Times New Roman', Times, serif; color: var(--muted); max-width: 580px; margin: 0 auto 24px; }
    .gold-line { width: 75px; height: 1px; margin: 23px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .mode-card {
      margin: 16px auto 26px; width: min(100%, 520px); border: 1px solid var(--outline);
      border-radius: var(--radius); padding: 24px; background: linear-gradient(135deg, rgba(49,29,72,.90), rgba(24,14,38,.98));
      box-shadow: 0 30px 75px rgba(0,0,0,.22);
    }
    .mode-tabs { padding: 5px; border: 1px solid var(--outline); border-radius: 10px; display: flex; gap: 5px; background: rgba(13,7,26,.56); }
    .mode-tab { flex: 1; padding: 13px; background: transparent; border: 0; color: var(--muted); border-radius: 7px; font: 12px 'Times New Roman', Times, serif; letter-spacing: .15em; text-transform: uppercase; }
    .mode-tab[aria-selected="true"] { background: rgba(221,163,92,.19); color: var(--gold-light); box-shadow: inset 0 0 0 1px var(--outline); }
    .mode-description { min-height: 48px; margin: 19px 0; font: 13px/1.75 'Times New Roman', Times, serif; color: var(--muted); }
    .primary-button, .secondary-button {
      border-radius: 8px; min-height: 52px; padding: 14px 24px; font: bold 12px 'Times New Roman', Times, serif;
      letter-spacing: .15em; text-transform: uppercase; transition: transform .15s ease, background .15s ease;
    }
    .primary-button { border: 1px solid #d7ae64; background: linear-gradient(120deg, #ebc47e, #c99a4f); color: #26172e; width: 100%; }
    .primary-button:hover:not(:disabled) { transform: translateY(-2px); background: linear-gradient(120deg, #f5d69e, #d5a85d); }
    .secondary-button { border: 1px solid var(--outline); color: var(--gold-light); background: transparent; }
    .secondary-button:hover:not(:disabled) { background: rgba(226,184,110,.13); }
    .metrics { max-width: 720px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px auto 66px; }
    .metric { padding: 18px 12px; text-align: center; border-top: 1px solid var(--outline); border-bottom: 1px solid var(--outline); }
    .metric strong { display: block; font-size: 28px; color: var(--gold-light); font-weight: 400; }
    .metric span { font: 10px 'Times New Roman', Times, serif; text-transform: uppercase; letter-spacing: .17em; color: var(--muted); }
    .play-wrap { max-width: 720px; margin: 0 auto; padding: 66px 0 65px; }
    .game-status { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; color: var(--gold-muted); font: 11px 'Times New Roman', Times, serif; text-transform: uppercase; letter-spacing: .16em; }
    .round-dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .round-dot { height: 7px; width: 34px; max-width: 12vw; background: #4d3c60; border-radius: 5px; }
    .round-dot.current { background: var(--gold); box-shadow: 0 0 15px rgba(230,189,109,.35); }
    .round-dot.complete { background: #8971a5; }
    .game-card {
      background: linear-gradient(148deg, #39214f, #1b112a 75%); border: 1px solid var(--outline);
      border-radius: 20px; box-shadow: 0 25px 70px rgba(0,0,0,.28); padding: clamp(26px,6vw,52px);
      position: relative; overflow: hidden;
    }
    .game-card::before, .game-card::after { content: ''; position: absolute; width: 45px; height: 45px; pointer-events: none; }
    .game-card::before { top: 12px; left: 12px; border-left: 1px solid var(--outline); border-top: 1px solid var(--outline); }
    .game-card::after { bottom: 12px; right: 12px; border-right: 1px solid var(--outline); border-bottom: 1px solid var(--outline); }
    /* Question card. */
    .question-card {
      border: 1px solid #b99559; border-radius: 17px; overflow: hidden;
      box-shadow: 0 27px 70px rgba(0,0,0,.38), 0 0 0 4px rgba(185,149,89,.06);
      background: #eee0c3; color: #29251e; position: relative;
    }
    .question-card-top {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 19px 30px; background: #2b193d; border-bottom: 2px solid #c5a364;
    }
    .question-card-headings { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
    .question-overline { color: #d9bd91; font: 10px/1.3 'Times New Roman', Times, serif; letter-spacing: .18em; text-transform: uppercase; }
    .question-category {
      display: inline-flex; align-items: center; border: 1px solid rgba(232,197,133,.67);
      border-radius: 100px; padding: 8px 13px; color: #f3d596;
      font: 600 11px/1 'Times New Roman', Times, serif; letter-spacing: .14em; text-transform: uppercase;
    }
    .timer-ring {
      --progress-angle: 360deg; width: 68px; height: 68px; flex-shrink: 0;
      border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(#f0ce8f var(--progress-angle), rgba(240,206,143,.16) 0);
    }
    .timer-inner { width: 58px; height: 58px; border-radius: 50%; background: #2b193d; display: grid; place-items: center; text-align: center; }
    .timer-number { font: 30px/.95 'Times New Roman',Times,serif; color: #f6dba6; }
    .timer-label { display: block; margin-top: 3px; color: #dac4e1; font: 8px 'Times New Roman',Times,serif; letter-spacing: .14em; text-transform: uppercase; }
    .timer-ring.urgent { background: conic-gradient(#f0a99a var(--progress-angle),rgba(240,169,154,.12) 0); }
    .timer-ring.urgent .timer-number { color: #f0a99a; }
    .question-body {
      padding: clamp(32px, 6vw, 54px) clamp(26px, 6vw, 54px) 38px;
      position: relative; isolation: isolate;
      background: radial-gradient(ellipse at 100% 0%, rgba(157,115,49,.10), transparent 55%),
                  linear-gradient(150deg, #f5e9d0, #e8d8b8);
    }
    .question-body::before {
      content: '✦'; position: absolute; top: 21px; right: 30px; z-index: -1;
      color: rgba(118,84,37,.13); font: 130px/1 'Times New Roman',Times,serif;
      pointer-events: none;
    }
    .question-kicker {
      display: inline-flex; align-items: center; gap: 9px; margin-bottom: 18px;
      color: #77623f; font: 700 10px/1.4 'Times New Roman',Times,serif; letter-spacing: .23em; text-transform: uppercase;
    }
    .question-kicker::before { content: ''; width: 23px; height: 1px; background: #ab8b58; }
    .question-title { color: #28231c; font: 400 clamp(31px,4.5vw,46px)/1.18 'Times New Roman',Times,serif; letter-spacing: -.026em; margin: 0 0 21px; position:relative; }
    .question-hint { color: #5f5342; font: 14px/1.7 'Times New Roman',Times,serif; margin: 0; max-width: 540px; }
    .question-answer-zone { background: #28183b; border-top: 1px solid #aa8955; padding: 30px clamp(25px,6vw,53px) 32px; }
    .answer-label { color: #e8c78d; display: block; font: 700 11px 'Times New Roman',Times,serif; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
    .answer-input { display: block; width: 100%; background: #150e21; color: #f8eedb; border: 1px solid #9575a6; border-radius: 9px; padding: 15px 18px; font: 20px/1.35 'Times New Roman',Times,serif; outline: none; }
    .answer-input::placeholder { color: #ad99b6; }
    .answer-input:focus { border-color: #eac681; box-shadow: 0 0 0 3px rgba(221,163,92,.19); }
    .answer-input[aria-invalid="true"] { border-color: #f0a99a; }
    .answer-error { color: #f0b4a9; font: 12px/1.5 'Times New Roman',Times,serif; margin: 9px 0 0; min-height: 19px; }
    .game-actions { display: flex; gap: 14px; align-items: center; margin-top: 13px; }
    .question-card .game-actions .primary-button { flex: 1; width: auto; }
    .question-card .skip-button { flex: 0 0 auto; padding: 15px 12px; color: #d1badb; border: 0; background: none; font: 12px 'Times New Roman',Times,serif; }
    .question-card .skip-button:hover { color: #fff4d6; }
    .reveal { text-align: center; padding: 12px 0 6px; }
    .reveal-label { font: 11px 'Times New Roman', Times, serif; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-muted); }
    .award-coin {
      display: grid; place-items: center; margin: 20px auto; width: 133px; height: 133px; border-radius: 50%;
      background: radial-gradient(circle, rgba(239,203,126,.14), rgba(239,203,126,.03) 63%, transparent 65%);
      border: 2px solid var(--gold); outline: 1px solid var(--outline); outline-offset: 7px;
      color: var(--gold-light);
    }
    .award-number { font-size: 46px; line-height: 1; }
    .award-caption { font: 9px 'Times New Roman', Times, serif; text-transform: uppercase; letter-spacing: .16em; color: var(--gold-muted); }
    .result-tier { font-size: 30px; font-weight: normal; margin: 28px 0 8px; }
    .result-answer { font: 14px/1.7 'Times New Roman', Times, serif; color: var(--muted); margin-bottom: 24px; }
    .result-answer strong { color: var(--ink); font-weight: 500; }
    .reveal .primary-button { max-width: 360px; }
    .score-head { text-align: center; padding-top: 4px; }
    .score-head h1 { font-size: clamp(44px, 6vw, 70px); margin-bottom: 10px; }
    .score-large { font-size: clamp(62px, 9vw, 100px); line-height: 1; color: var(--gold-light); margin: 15px 0 8px; }
    .score-large span { color: var(--gold-muted); font-size: 24px; }
    .score-desc { color: var(--muted); font: 13px/1.7 'Times New Roman', Times, serif; margin: 0 0 26px; }
    .result-list { border-top: 1px solid var(--outline); margin: 18px 0 26px; }
    .result-row { display: grid; grid-template-columns: 38px 1fr 80px; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--outline); font: 13px/1.5 'Times New Roman', Times, serif; }
    .result-row .index { color: var(--gold-muted); }
    .result-row strong { font-weight: 500; color: var(--ink); }
    .result-row small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .result-row .pts { text-align: right; color: var(--gold-light); }
    .results-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
    details { border-top: 1px solid var(--outline); padding: 16px 0 0; }
    summary { cursor: pointer; color: var(--gold-light); font: 12px 'Times New Roman', Times, serif; letter-spacing: .09em; }
    .answer-bank { margin: 18px 0 8px; }
    .answer-bank h3 { color: var(--gold-light); font-size: 15px; font-weight: 400; margin-bottom: 6px; }
    .answer-bank p { font: 12px/1.85 'Times New Roman', Times, serif; color: var(--muted); margin: 0; }
    .toast { min-height: 24px; color: var(--gold-light); font: 12px 'Times New Roman', Times, serif; text-align: center; }
    footer { border-top: 1px solid var(--outline); padding: 25px 0 38px; text-align: center; color: #a898b3; font: 11px/1.9 'Times New Roman', Times, serif; }
    footer strong { color: var(--gold-muted); font-weight: 400; }
    dialog { background: #28183b; color: var(--ink); width: min(92vw, 510px); padding: 30px; border: 1px solid var(--gold-muted); border-radius: 16px; box-shadow: 0 30px 90px #0009; }
    dialog::backdrop { background: rgba(10,6,21,.82); }
    dialog h2 { font-size: 31px; font-weight: 400; color: var(--gold-light); }
    dialog p, dialog li { font: 13px/1.75 'Times New Roman', Times, serif; color: var(--muted); }
    dialog ol { padding-left: 21px; }
    dialog .secondary-button { margin-top: 10px; }
    @media (max-width: 640px) {
      .shell { padding: 0 17px; }
      .header { min-height: 78px; }
      .brand-name { font-size: 14px; letter-spacing: .045em; }
      .brand-sub { font-size: 9px; }
      .brand-emblem { width: 37px; height: 37px; }
      .header-link { padding: 9px 12px; }
      .hero { padding-top: 44px; }
      .hero-coin { width: 136px; height: 136px; }
      .lede { font-size: 14px; }
      .mode-card { padding: 18px; }
      .metrics { gap: 5px; margin-bottom: 35px; }
      .metric strong { font-size: 23px; }
      .metric span { font-size: 9px; letter-spacing: .05em; }
      .play-wrap { padding-top: 37px; }
      .game-card { padding: 32px 22px; }
      .question-card-top { padding: 17px 19px; }
      .question-body { padding: 34px 24px 31px; }
      .question-body::before { right: 15px; font-size: 105px; }
      .question-answer-zone { padding: 26px 22px 27px; }
      .question-card .game-actions { flex-direction: column; align-items: stretch; gap: 4px; }
      .question-card .skip-button { padding: 12px; }
      .timer-ring { width: 62px; height: 62px; }
      .timer-inner { width: 52px; height: 52px; }
      .timer-number { font-size: 27px; }
      .timer-label { font-size: 6px; letter-spacing: .02em; }
      .results-actions { grid-template-columns: 1fr; }
    }

    /* Purple and gold. */
    .brand-name { font-size: clamp(26px, 3.2vw, 37px); font-weight: 700; letter-spacing: .26em; }
    .brand-sub { font-size: 10px; letter-spacing: .13em; color: #d4b9e2; }
    .brand-emblem { background: radial-gradient(circle at 34% 30%, #5c3472, #1a1029); box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--outline), 0 0 28px rgba(225,170,94,.13); }
    .header { border-bottom-color: rgba(233,191,119,.28); }
    .hero h1 { letter-spacing: -.037em; font-weight: 700; }
    .hero h1 span { font-style: italic; font-weight: 400; }
    .hero-coin { filter: drop-shadow(0 14px 40px rgba(153,92,200,.17)); }
    .lede { font-size: 18px; line-height: 1.6; }
    .eyebrow, .mode-tab, .primary-button, .secondary-button, .brand-sub { font-weight: 700; }
    .mode-card { box-shadow: 0 24px 65px rgba(7,3,14,.45), inset 0 1px 0 rgba(242,207,157,.07); }
    .mode-tab[aria-selected="true"] { background: linear-gradient(110deg,rgba(111,64,152,.55),rgba(70,42,105,.4)); color: #fbe7bd; }
    .primary-button { background: linear-gradient(130deg,#f8df9a,#dfac58 70%,#b77932); border-color: #f8d38c; box-shadow: 0 8px 24px rgba(184,125,46,.13); }
    .primary-button:hover:not(:disabled) { background: linear-gradient(130deg,#ffe8ad,#ebbd6e 70%,#c58f3d); }
    .metric { background: linear-gradient(180deg,rgba(74,40,101,.18),transparent); }
    .question-card { border-color: #d5ad69; box-shadow: 0 24px 65px rgba(4,2,14,.47),0 0 0 4px rgba(210,168,103,.065); }
    .question-card-top { background: linear-gradient(115deg,#39204e,#21132f); }
    .question-category { background: rgba(232,197,133,.075); }
    .question-body { background: radial-gradient(ellipse at 100% 0%, rgba(122,69,139,.09), transparent 56%), linear-gradient(146deg,#faf0da,#e9d8ba); }
    .question-title { font-family: 'Times New Roman', Times, serif; font-size: clamp(32px,4.7vw,48px); font-weight: 700; }
    .question-hint { font-size: 16px; font-style: italic; }
    .question-answer-zone { background: linear-gradient(140deg,#2d1a40,#1a1029); }
    .answer-input { font-size: 23px; }
    .answer-input:focus { box-shadow: 0 0 0 3px rgba(210,163,237,.23); }
    .timer-inner { background: #271636; }
    .award-coin { transition: border-color .2s, color .2s; }
    .result-tier { font-size: 35px; margin: 16px 0 6px; }
    .score-head h1 span { color: #e7bf71; font-style: italic; }
    .result-row { grid-template-columns: 38px minmax(0,1fr) 80px; }
    .result-row small { line-height: 1.65; }
    /* Rarity colors. */
    .tier-common { --tier: #d7a48a; --tier-glow: rgba(215,164,138,.16); }
    .tier-familiar { --tier: #e1dce6; --tier-glow: rgba(225,220,230,.13); }
    .tier-uncommon { --tier: #8cdfb4; --tier-glow: rgba(140,223,180,.15); }
    .tier-rare { --tier: #8fbfff; --tier-glow: rgba(143,191,255,.16); }
    .tier-epic { --tier: #d4a0ff; --tier-glow: rgba(212,160,255,.18); }
    .tier-gold { --tier: #ffda7b; --tier-glow: rgba(255,218,123,.20); }
    .tier-null { --tier: #a9a2b4; --tier-glow: rgba(169,162,180,.14); }
    .rarity-section { max-width: 850px; margin: -23px auto 56px; text-align: center; }
    .rarity-heading { margin-bottom: 17px; color: #c6a4db; letter-spacing: .22em; }
    .rarity-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .rarity-pill { display: inline-flex; align-items: center; justify-content: center; gap: 9px; white-space: nowrap; padding: 9px 11px; border: 1px solid color-mix(in srgb,var(--tier) 45%,transparent); border-radius: 999px; background: var(--tier-glow); color: var(--tier); font-size: 12px; font-weight: 700; letter-spacing: .07em; }
    .rarity-pill small { font-size: 12px; font-weight: 400; padding-left: 5px; opacity: .85; }
    .rarity-gem { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--tier); box-shadow: 0 0 11px var(--tier-glow); }
    .reveal-tier { margin: 0 auto 2px; padding: 8px 17px; }
    .award-coin[class*="tier-"] { color: var(--tier); border-color: var(--tier); background: radial-gradient(circle, var(--tier-glow),transparent 73%); box-shadow: 0 0 38px var(--tier-glow); }
    .result-tier[class*="tier-"] { color: var(--tier); }
    .inline-tier[class*="tier-"] { color: var(--tier); font-weight: 700; }
    .pts[class*="tier-"] { color: var(--tier); font-weight: 700; }
    @media (max-width: 640px) {
      .brand-name { font-size: 24px; letter-spacing: .16em; }
      .brand-sub { font-size: 8px; }
      .rarity-section { margin: -10px auto 38px; }
      .rarity-legend { gap: 7px; }
      .rarity-pill { font-size: 10px; padding: 8px 10px; }
      .rarity-pill small { font-size: 10px; }
      .hero h1 { font-size: clamp(43px,9vw,62px); }
    }

    /* Compact home and score displays. */
    .hero { padding: 59px 0 18px; }
    .hero h1 { margin: 7px 0 8px; font-weight: 700; letter-spacing: .13em; font-size: clamp(50px, 7vw, 86px); }
    .hero-coin { margin-bottom: 12px; }
    .hero .gold-line { margin: 17px auto 23px; }
    .mode-description { min-height: 18px; margin: 14px 0; }
    .mode-description:empty { display: none; }
    .mode-tabs + .mode-description:empty + .primary-button { margin-top: 20px; }
    .result-tier[class*="tier-"]::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 11px; border-radius: 50%; background: var(--tier); box-shadow: 0 0 12px var(--tier-glow); vertical-align: middle; }
    @media (max-width:640px) {
      .hero { padding-top: 36px; }
      .hero h1 { font-size: clamp(44px, 10vw, 58px); letter-spacing: .08em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand" aria-label="AURUM">
        <span class="brand-emblem" aria-hidden="true">✦</span>
        <div><div class="brand-name">AURUM</div><div class="brand-sub">CERTAMEN</div></div>
      </div>
      <div class="header-right">
        <button class="header-link" id="how-button" type="button">HOW TO PLAY</button>
      </div>
    </header>
    <main id="app" aria-live="off"></main>
    <footer><strong>AURUM</strong></footer>
  </div>
  <dialog id="how-dialog" aria-labelledby="how-title">
    <h2 id="how-title">How to play</h2>
    <p>Seven questions. Twenty-five seconds each.</p>
    <ol>
      <li>Enter an answer before time runs out.</li>
      <li>Rarer answers score more points.</li>
      <li>Practice draws from previous questions.</li>
    </ol>
    <p>Macrons are optional.</p>
    <form method="dialog"><button class="secondary-button" type="submit">CLOSE</button></form>
  </dialog>
  <script src="./questions.js"></script>
  <script>
    'use strict';

    const SECONDS_PER_ROUND = 25;
    const ROUNDS_PER_GAME = 7;
    const STORAGE_KEY = 'aurum.daily.latest-seven.v1';
    const PREVIOUS_STORAGE_KEY = 'gold.daily.latest-seven.v1';
    const TIERS = [
      { minimum: 100, title: 'Aurum', css: 'tier-gold', symbol: '🟨' },
      { minimum: 80, title: 'Rarissimus', css: 'tier-epic', symbol: '🟪' },
      { minimum: 60, title: 'Rarus', css: 'tier-rare', symbol: '🟦' },
      { minimum: 40, title: 'Insolitus', css: 'tier-uncommon', symbol: '🟩' },
      { minimum: 25, title: 'Notus', css: 'tier-familiar', symbol: '⬜' },
      { minimum: 10, title: 'Communis', css: 'tier-common', symbol: '🟫' },
      { minimum: 0, title: 'Nullus', css: 'tier-null', symbol: '⬛' }
    ];

    const app = document.getElementById('app');
    const howDialog = document.getElementById('how-dialog');
    let chosenMode = 'daily';
    let tickId = null;
    let state = null;
    const utcDay = () => new Date().toISOString().slice(0, 10);
    let cachedDaily = null;

    document.getElementById('how-button').addEventListener('click', () => howDialog.showModal());
    const escapeHTML = (text) => String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const normalize = (text) => String(text).toLowerCase().replace(/æ/g,'ae').replace(/œ/g,'oe')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
    const tierFor = (points) => TIERS.find(tier => points >= tier.minimum);

    // The last seven entries are daily; older entries are practice.
    function pickQuestions(date, mode) {
      if (mode === 'daily') return QUESTION_BANK.slice(-ROUNDS_PER_GAME);
      const archive = QUESTION_BANK.slice(0, -ROUNDS_PER_GAME);
      const shuffled = archive.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, ROUNDS_PER_GAME);
    }
    // Changing the seven question IDs starts a new daily edition.
    const activeEdition = () => QUESTION_BANK.slice(-ROUNDS_PER_GAME).map(q => q.id).join('|');
    function loadDaily() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(PREVIOUS_STORAGE_KEY) || 'null');
        if (!value || value.date !== utcDay() || value.edition !== activeEdition() || !['playing','feedback','finished'].includes(value.phase)) return null;
        if (!Number.isInteger(value.round) || value.round < 0 || value.round > ROUNDS_PER_GAME) return null;
        if (!Array.isArray(value.entries) || value.entries.length > ROUNDS_PER_GAME) return null;
        const expectedEntries = value.phase === 'feedback' ? value.round + 1 : Math.min(value.round, ROUNDS_PER_GAME);
        if (value.entries.length !== expectedEntries) return null;
        if (value.phase === 'playing' && !Number.isFinite(value.deadline)) return null;
        if (!Array.isArray(value.questionIds) || value.questionIds.length !== ROUNDS_PER_GAME) return null;
        if (new Set(value.questionIds).size !== ROUNDS_PER_GAME) return null;
        return value;
      } catch { return null; }
    }
    function saveDaily() {
      if (!state || state.mode !== 'daily') return;
      try {
        const { date, phase, round, entries, deadline } = state;
        const questionIds = state.questions.map(q => q.id);
        const record = { date, edition: activeEdition(), phase, round, entries, deadline, questionIds };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
        localStorage.removeItem(PREVIOUS_STORAGE_KEY);
        cachedDaily = record;
      } catch { /* Private mode and storage restrictions must not stop the game. */ }
    }
    function stopTimer() { if (tickId !== null) { clearInterval(tickId); tickId = null; } }
    function totalScore() { return state.entries.reduce((sum, item) => sum + item.points, 0); }
    function currentQuestion() { return state.questions[state.round]; }
    function coinSVG() {
      return `<svg class="hero-coin" viewBox="0 0 200 200" role="img" aria-label="AURUM medallion">
        <defs><radialGradient id="coin-fill"><stop stop-color="#563075"/><stop offset=".8" stop-color="#2c1843"/><stop offset="1" stop-color="#10091b"/></radialGradient></defs>
        <circle cx="100" cy="100" r="91" fill="url(#coin-fill)" stroke="#b79253" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="82" fill="none" stroke="#b79253" stroke-opacity=".5"/>
        <circle cx="100" cy="100" r="72" fill="none" stroke="#b79253" stroke-opacity=".26"/>
        <g stroke="#dcbb7f" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M78 150C40 129 43 78 75 51"/><path d="M122 150c38-21 35-72 3-99"/>
        </g>
        <g fill="#d4ae6a">
          <ellipse cx="57" cy="127" rx="5" ry="12" transform="rotate(-44 57 127)"/>
          <ellipse cx="50" cy="106" rx="5" ry="12" transform="rotate(-22 50 106)"/>
          <ellipse cx="53" cy="85" rx="5" ry="12" transform="rotate(14 53 85)"/>
          <ellipse cx="66" cy="65" rx="5" ry="11" transform="rotate(36 66 65)"/>
          <ellipse cx="143" cy="127" rx="5" ry="12" transform="rotate(44 143 127)"/>
          <ellipse cx="150" cy="106" rx="5" ry="12" transform="rotate(22 150 106)"/>
          <ellipse cx="147" cy="85" rx="5" ry="12" transform="rotate(-14 147 85)"/>
          <ellipse cx="134" cy="65" rx="5" ry="11" transform="rotate(-36 134 65)"/>
        </g>
        <text x="100" y="95" fill="#f6dfa7" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:44px">A</text>
        
        <path d="M78 130h44" stroke="#a98c59" stroke-width="1"/>
      </svg>`;
    }

    function showHome() {
      stopTimer();
      const todayDone = cachedDaily && cachedDaily.date === utcDay() && cachedDaily.phase === 'finished';
      const todayStarted = cachedDaily && cachedDaily.date === utcDay() && cachedDaily.phase !== 'finished';
      app.innerHTML = `
        <section class="hero">
          ${coinSVG()}
          <h1>AURUM</h1>
          <div class="gold-line"></div>
          <div class="mode-card">
            <div class="mode-tabs" role="tablist" aria-label="Game mode">
              <button type="button" class="mode-tab" role="tab" data-mode="daily" aria-selected="${chosenMode === 'daily'}">TODAY</button>
              <button type="button" class="mode-tab" role="tab" data-mode="practice" aria-selected="${chosenMode === 'practice'}">PRACTICE</button>
            </div>
            <p id="mode-description" class="mode-description"></p>
            <button id="start-button" class="primary-button" type="button"></button>
          </div>
        </section>
        <div class="metrics" aria-label="Game facts">
          <div class="metric"><strong>VII</strong><span>QUESTIONS</span></div>
          <div class="metric"><strong>XXV</strong><span>SECONDS</span></div>
          <div class="metric"><strong>DCC</strong><span>POINTS</span></div>
        </div>
        <section class="rarity-section" aria-label="Answer rarity levels">
          <div class="eyebrow rarity-heading">GRADUS</div>
          <div class="rarity-legend">${TIERS.filter(t => t.minimum > 0).reverse().map(t => `<span class="rarity-pill ${t.css}" title="${escapeHTML(t.title)}"><span class="rarity-gem" aria-hidden="true"></span><span>${t.title}</span><small>${t.minimum}</small></span>`).join('')}</div>
        </section>`;
      const modeDescription = document.getElementById('mode-description');
      const startButton = document.getElementById('start-button');
      function updateMode() {
        document.querySelectorAll('.mode-tab').forEach(button => button.setAttribute('aria-selected', String(button.dataset.mode === chosenMode)));
        if (chosenMode === 'practice') {
          modeDescription.textContent = 'Earlier questions.';
          startButton.textContent = 'PLAY';
        } else if (todayDone) {
          modeDescription.textContent = 'Complete.';
          startButton.textContent = 'RESULTS';
        } else if (todayStarted) {
          modeDescription.textContent = 'In progress.';
          startButton.textContent = 'RESUME';
        } else {
          modeDescription.textContent = '';
          startButton.textContent = 'PLAY';
        }
      }
      app.querySelectorAll('.mode-tab').forEach(button => button.addEventListener('click', () => { chosenMode = button.dataset.mode; updateMode(); }));
      startButton.addEventListener('click', () => startGame(chosenMode));
      updateMode();
    }
    function startGame(mode) {
      stopTimer();
      if (mode === 'daily') {
        state = null;
        cachedDaily = loadDaily();
        if (cachedDaily) {
          const byId = new Map(QUESTION_BANK.map(q => [q.id, q]));
          const questions = cachedDaily.questionIds.map(id => byId.get(id));
          if (questions.every(Boolean)) {
            state = { ...cachedDaily, mode, questions };
          } else {
            // A question was deleted while this daily game was in progress.
            // Reset only the incompatible local save. Do not crash the site.
            try { localStorage.removeItem(STORAGE_KEY); } catch {}
            cachedDaily = null;
          }
          if (state && state.phase === 'playing' && Date.now() >= state.deadline) { finishRoundFromTimeout(); return; }
          if (state) { render(); return; }
        }
      }
      const date = utcDay();
      state = { mode, date, questions: pickQuestions(date, mode), phase: 'playing', round: 0, entries: [], deadline: Date.now() + SECONDS_PER_ROUND * 1000 };
      saveDaily();
      render();
    }
    function progressHTML() {
      return `<div class="game-status"><span>${state.mode === 'daily' ? 'COTIDIANVM' : 'EXERCITATIO'}</span><span>${totalScore()} / 700 PTS</span></div>
        <div class="round-dots" aria-label="${state.entries.length} of ${ROUNDS_PER_GAME} questions completed">
        ${Array.from({length: ROUNDS_PER_GAME}, (_, i) => `<span class="round-dot ${i < state.round ? 'complete' : i === state.round ? 'current' : ''}" aria-hidden="true"></span>`).join('')}
        </div>`;
    }
    function render() {
      stopTimer();
      if (!state) { showHome(); return; }
      if (state.phase === 'playing') renderQuestion();
      else if (state.phase === 'feedback') renderFeedback();
      else if (state.phase === 'finished') renderResults();
    }
    function renderQuestion() {
      const q = currentQuestion();
      app.innerHTML = `<section class="play-wrap">
        ${progressHTML()}
        <article class="question-card">
          <div class="question-card-top">
            <div class="question-card-headings">
              <div class="question-overline">${state.mode === 'daily' ? 'COTIDIANVM' : 'EXERCITATIO'} · QVÆSTIO ${String(state.round + 1).padStart(2,'0')} / VII</div>
              <span class="question-category">${escapeHTML(q.category)}</span>
            </div>
            <div id="timer-ring" class="timer-ring" role="timer" aria-label="Time remaining"><div class="timer-inner"><div><div id="timer-number" class="timer-number">25</div><div class="timer-label">SECONDS</div></div></div></div>
          </div>
          <div class="question-body">
            <h2 class="question-title">${escapeHTML(q.prompt)}</h2>
            <p class="question-hint">${escapeHTML(q.hint)}</p>
          </div>
          <form id="answer-form" class="question-answer-zone" autocomplete="off" novalidate>
            <label class="answer-label" for="answer-input">ANSWER</label>
            <input id="answer-input" class="answer-input" type="text" maxlength="90" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="answer-error">
            <p id="answer-error" class="answer-error" role="status" aria-live="polite"></p>
            <div class="game-actions"><button class="primary-button" type="submit">SUBMIT</button><button class="skip-button" id="skip-button" type="button">PASS</button></div>
          </form>
        </article>
      </section>`;
      document.getElementById('answer-form').addEventListener('submit', event => { event.preventDefault(); submitAnswer(); });
      document.getElementById('skip-button').addEventListener('click', () => finishRound(null));
      document.getElementById('answer-input').addEventListener('input', event => {
        event.target.removeAttribute('aria-invalid');
        document.getElementById('answer-error').textContent = '';
      });
      document.getElementById('answer-input').focus({preventScroll:true});
      updateTimer();
      if (state.phase === 'playing') tickId = setInterval(updateTimer, 100);
    }
    function findAnswer(question, rawText) {
      const candidate = normalize(rawText);
      if (!candidate) return null;
      return question.answers.find(answer => [answer.name, ...answer.aliases].some(option => normalize(option) === candidate)) || null;
    }
    function submitAnswer() {
      if (!state || state.phase !== 'playing') return;
      if (Date.now() >= state.deadline) { finishRoundFromTimeout(); return; }
      const input = document.getElementById('answer-input');
      const answer = findAnswer(currentQuestion(), input.value);
      if (answer) { finishRound(answer); return; }
      const error = document.getElementById('answer-error');
      error.textContent = input.value.trim() ? 'Answer not found. Try another.' : 'Enter an answer or pass.';
      input.setAttribute('aria-invalid', 'true');
      input.focus();
    }
    function updateTimer() {
      if (!state || state.phase !== 'playing') return;
      const remaining = Math.max(0, state.deadline - Date.now());
      const ring = document.getElementById('timer-ring');
      const number = document.getElementById('timer-number');
      if (!ring || !number) return;
      ring.style.setProperty('--progress-angle', `${360 * remaining / (SECONDS_PER_ROUND * 1000)}deg`);
      ring.classList.toggle('urgent', remaining <= 6000);
      number.textContent = String(Math.ceil(remaining / 1000));
      if (remaining <= 0) finishRoundFromTimeout();
    }
    function finishRoundFromTimeout() {
      if (!state || state.phase !== 'playing') return;
      const input = document.getElementById('answer-input');
      const autoAnswer = input ? findAnswer(currentQuestion(), input.value) : null;
      finishRound(autoAnswer);
    }
    function finishRound(answer) {
      if (!state || state.phase !== 'playing' || state.entries.length !== state.round) return;
      stopTimer();
      const q = currentQuestion();
      state.entries.push({ questionId: q.id, answer: answer ? answer.name : null, points: answer ? answer.points : 0 });
      state.phase = 'feedback';
      state.deadline = null;
      saveDaily();
      render();
    }
    function renderFeedback() {
      const last = state.entries[state.round];
      const tier = tierFor(last.points);
      app.innerHTML = `<section class="play-wrap">${progressHTML()}
        <article class="game-card"><div class="reveal">
          <div class="reveal-label">QVÆSTIO ${state.round + 1} / VII</div>
          <div class="award-coin ${tier.css}"><div><div class="award-number">${last.points}</div><div class="award-caption">PUNCTA</div></div></div>
                    <h2 class="result-tier ${tier.css}">${escapeHTML(tier.title)}</h2>
          <p class="result-answer">${last.answer ? `<strong>${escapeHTML(last.answer)}</strong>` : 'No answer'}</p>
          <button class="primary-button" id="next-button" type="button">${state.round === ROUNDS_PER_GAME - 1 ? 'RESULTS' : 'NEXT QUESTION'}</button>
        </div></article></section>`;
      document.getElementById('next-button').addEventListener('click', advanceRound);
      document.getElementById('next-button').focus({preventScroll:true});
    }
    function advanceRound() {
      if (!state || state.phase !== 'feedback') return;
      if (state.round === ROUNDS_PER_GAME - 1) {
        state.phase = 'finished'; state.round = ROUNDS_PER_GAME; state.deadline = null;
      } else {
        state.round += 1;
        state.phase = 'playing'; state.deadline = Date.now() + SECONDS_PER_ROUND * 1000;
      }
      saveDaily(); render();
    }
    function shareText() {
      const symbols = state.entries.map(item => tierFor(item.points).symbol).join('');
      const url = window.location.protocol === 'file:' ? '' : window.location.href.split('#')[0].split('?')[0];
      return `AURUM\n${state.mode === 'daily' ? state.date + ' · Daily' : 'Practice'}\n${totalScore()} / 700\n${symbols}${url ? '\n' + url : ''}`;
    }
    async function copyResult() {
      const text = shareText();
      const toast = document.getElementById('copy-status');
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else {
          const field = document.createElement('textarea');
          field.value = text; field.style.position = 'fixed'; field.style.opacity = '0';
          document.body.appendChild(field); field.select();
          if (!document.execCommand('copy')) throw new Error('Clipboard unavailable');
          field.remove();
        }
        toast.textContent = 'Score copied.';
      } catch { toast.textContent = 'Copy is unavailable in this browser. You can select your score above.'; }
    }
    function renderResults() {
      const total = totalScore();
      app.innerHTML = `<section class="play-wrap">
        <div class="score-head"><div class="eyebrow">FINIS</div>
          <h1>${state.mode === 'daily' ? 'Daily' : 'Practice'}</h1>
          <div class="score-large">${total}<span> / 700</span></div>
        </div>
        <article class="game-card">
          <div class="eyebrow" style="margin-bottom:12px">ANSWERS</div>
          <div class="result-list">${state.entries.map((entry,i) => {
            const q = state.questions[i];
            return `<div class="result-row"><span class="index">0${i+1}</span><div><strong>${escapeHTML(entry.answer || 'No answer')}</strong><small>${escapeHTML(q.category)} · <span class="inline-tier ${tierFor(entry.points).css}">${tierFor(entry.points).title}</span></small></div><span class="pts ${tierFor(entry.points).css}">${entry.points} PTS</span></div>`;
          }).join('')}</div>
          <div class="results-actions">
            <button id="share-button" class="primary-button" type="button">COPY SCORE</button>
            <button id="practice-button" class="secondary-button" type="button">PLAY PRACTICE</button>
          </div>
          <div id="copy-status" class="toast" role="status" aria-live="polite"></div>
          <details><summary>ACCEPTED ANSWERS</summary>
            ${state.questions.map(q => `<div class="answer-bank"><h3>${escapeHTML(q.prompt)}</h3><p>${q.answers.slice().sort((a,b)=>a.points-b.points || a.name.localeCompare(b.name)).map(a=>`${escapeHTML(a.name)} (${a.points})`).join(' · ')}</p></div>`).join('')}
          </details>
        </article>
        <p style="text-align:center;margin-top:23px"><button id="home-button" class="header-link" type="button">← HOME</button></p>
      </section>`;
      document.getElementById('share-button').addEventListener('click', copyResult);
      document.getElementById('practice-button').addEventListener('click', () => { chosenMode = 'practice'; startGame('practice'); });
      document.getElementById('home-button').addEventListener('click', showHome);
    }

    // Check question data before starting.
    function validateQuestionBank() {
      if (!Array.isArray(QUESTION_BANK)) throw new Error('QUESTION_BANK is missing from questions.js.');
      if (QUESTION_BANK.length < ROUNDS_PER_GAME * 2) throw new Error('Add at least seven latest questions and seven older practice questions (14 total).');
      const ids = new Set();
      for (const q of QUESTION_BANK) {
        if (!q.id || ids.has(q.id)) throw new Error('Question IDs must be unique: ' + q.id);
        ids.add(q.id);
        if (!CATEGORIES.includes(q.category)) throw new Error('Unknown category in ' + q.id + ': ' + q.category);
        if (!q.prompt || !Array.isArray(q.answers) || q.answers.length === 0) throw new Error('Missing prompt/answers: ' + q.id);
        const used = new Set();
        for (const answer of q.answers) {
          if (!answer.name || ![10,25,40,60,80,100].includes(answer.points)) throw new Error('Invalid answer or score in ' + q.id);
          if (!Array.isArray(answer.aliases)) throw new Error('Aliases must be an array in ' + q.id);
          for (const variant of [answer.name, ...answer.aliases]) {
            const key = normalize(variant);
            if (!key || used.has(key)) throw new Error('Repeated or empty answer/alias in ' + q.id + ': ' + variant);
            used.add(key);
          }
        }
      }
    }

    // Restore the daily game on reload.
    try {
      validateQuestionBank();
      cachedDaily = loadDaily();
      if (cachedDaily) startGame('daily'); else showHome();
    } catch (error) {
      app.innerHTML = '<section class="play-wrap"><h2>Question data needs fixing</h2><p class="lede">Check questions.js: ' + escapeHTML(error.message) + '</p></section>';
      console.error(error);
    }
  </script>
</body>
</html>
